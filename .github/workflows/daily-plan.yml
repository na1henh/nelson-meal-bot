name: Daily meal plan

# Builds today's plan and publishes it to the website (docs/) and the widget file.
# Times are UTC: 11:17 = 6:17 AM Eastern, 13:17 = 8:17 AM, 16:17 = 11:17 AM (an hour later in summer).
# The later runs are retries for mornings when OU's menu site is down or GitHub skips a
# scheduled run; each does nothing if today's plan is already published.
# Minute 17 avoids the top of the hour, when GitHub most often delays or drops scheduled runs.
on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "17 13 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's plan even if it is already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and publish today's plan
        env:
          NELSON_PROFILE: ${{ secrets.NELSON_PROFILE }}
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          if [ -f "docs/plans/$TODAY.json" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Today's plan is already published."
            exit 0
          fi
          if [ -z "$NELSON_PROFILE" ]; then
            echo "::error::The NELSON_PROFILE secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          for attempt in 1 2; do
            set +e
            python nelson_bot.py --patient --date "$TODAY" --publish-dir docs
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
              echo "::error::The bot crashed (exit code $code). See the log above."
              exit 1
            fi
            echo "Attempt $attempt got no usable menu (exit code $code)."
          done
          echo "::warning::No plan for $TODAY: Nelson may be closed or OU's menu site is down."

      - name: Save the plan and the nutrition cache
        run: |
          git config user.name "meal-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .cache
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Meal plan for $TODAY"
            git push
          fi
